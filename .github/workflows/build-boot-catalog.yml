name: build-boot-catalog

on:
  push:
    paths:
      - "boot-recovery/**"
      - "tools/build-boot-catalog.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-boot-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate catalogs/boot-recovery.json
        run: python3 tools/build-boot-catalog.py

      - name: Commit if changed
        run: |
          git config user.name "catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalogs/boot-recovery.json
          git diff --cached --quiet || git commit -m "Update boot-recovery catalog"
          git push
