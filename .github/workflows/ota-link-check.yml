name: OTA Link Check

on:
  # Monday, Wednesday and Friday -> gaps of 2, 2 and 3 days (06:23 UTC).
  # Odd minute on purpose: the top of the hour is the most congested.
  schedule:
    - cron: "23 6 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only (does not modify the Wiki)"
        type: boolean
        default: false
      force:
        description: "Ignore the safety guard (mass drop of links)"
        type: boolean
        default: false

permissions:
  contents: write   # push to the Wiki
  actions: write    # schedule keepalive (see last step)

concurrency:
  group: ota-link-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ota-checker/requirements.txt

      - run: pip install -r ota-checker/requirements.txt

      - name: Clone the Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki

      - name: Check links
        env:
          OTA_FILE: wiki/OTA-Packages.md
          OTA_MSG_FILE: ${{ runner.temp }}/commit-msg.txt
          OTA_DRY_RUN: ${{ inputs.dry_run }}
          OTA_FORCE: ${{ inputs.force }}
          # "true" = update "Last URL check" even without changes (one commit per run)
          OTA_ALWAYS_BUMP_DATE: "false"
        run: python ota-checker/ota_link_checker.py

      - name: Update the Wiki (only if something changed)
        working-directory: wiki
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes. Wiki untouched."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OTA-Packages.md
          if [ -f "${{ runner.temp }}/commit-msg.txt" ]; then
            git commit -F "${{ runner.temp }}/commit-msg.txt"
          else
            git commit -m "chore: update OTA link status"
          fi
          git push

      # Public repos get scheduled workflows disabled after 60 days without
      # activity. Re-enabling the workflow on each run is how we avoid that.
      - name: Schedule keepalive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable ota-link-check.yml --repo "${{ github.repository }}"
